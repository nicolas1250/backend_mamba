
services:
  db:
    image: postgres:15-alpine
    container_name: mamba_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mamba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mamba1234}
      POSTGRES_DB: ${POSTGRES_DB:-semillero_mamba}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamba -d semillero_mamba"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mamba_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mamba}:${POSTGRES_PASSWORD:-mamba1234}@db:5432/${POSTGRES_DB:-semillero_mamba}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:

